[project]
name = "handover-ai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "PyMuPDF>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "paddleocr>=3.3,<3.4",
  "paddlepaddle>=3.2,<3.3",
  "httpx>=0.27,<1",
  "sqlglot>=28,<29",
  "jinja2>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
